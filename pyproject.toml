[project]
name = "lexmachina-mcp"
version = "0.1.0"
description = "MCP server for read-only Lex Machina litigation data"
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.12.*"
dependencies = [
    "httpx==0.28.1",
    "mcp>=2.3,<3",
]

[project.scripts]
lexmachina-mcp-setup = "lexmachina_mcp.setup:setup"
lexmachina-mcp-verify = "lexmachina_mcp.setup:verify"
lexmachina-mcp = "lexmachina_mcp.server:run"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx==0.23.1",
    "ruff==0.14.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
